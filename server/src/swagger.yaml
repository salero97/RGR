openapi: 3.0.0
info:
  title: Fire Safety API
  version: 1.0.0
  description: REST API системы управления инцидентами пожарной безопасности
servers:
  - url: /api/v1

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Регистрация
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullname]
              properties:
                email:
                  type: string
                password:
                  type: string
                fullname:
                  type: string
                role:
                  type: string
                  enum: [user, dispatcher, admin]
      responses:
        '201':
          description: Пользователь создан
        '409':
          description: Email уже существует
        '422':
          description: Ошибка валидации

  /auth/login:
    post:
      tags: [auth]
      summary: Вход
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Успешный вход, accessToken и user
        '401':
          description: Неверный email или пароль
        '422':
          description: Ошибка валидации
        '429':
          description: Слишком много неудачных попыток входа, IP заблокирован на 10 минут

  /auth/refresh:
    post:
      tags: [auth]
      summary: Обновление access token
      security: []
      responses:
        '200':
          description: Новый accessToken
        '401':
          description: Refresh token недействителен или отозван

  /auth/logout:
    post:
      tags: [auth]
      summary: Выход
      responses:
        '204':
          description: Успешный выход

  /incidents:
    get:
      tags: [incidents]
      summary: Получить список инцидентов
      description: Требует аутентификации. Доступно всем ролям.
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [new, inprogress, resolved, falsealarm]
        - in: query
          name: severity
          schema:
            type: string
            enum: [low, medium, high, critical]
        - in: query
          name: search
          schema:
            type: string
          description: Поиск по адресу, дому, типу угрозы, ответственному, описанию (ILIKE)
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Список инцидентов с пагинацией
        '401':
          description: Требуется авторизация
        '422':
          description: Некорректные параметры запроса

    post:
      tags: [incidents]
      summary: Создать инцидент
      description: Доступно ролям admin, dispatcher.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, house, floor, threattype, severity, status, responsible]
              properties:
                address:
                  type: string
                house:
                  type: string
                floor:
                  type: integer
                apartment:
                  type: string
                threattype:
                  type: string
                severity:
                  type: string
                  enum: [low, medium, high, critical]
                status:
                  type: string
                  enum: [new, inprogress, resolved, falsealarm]
                responsible:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Инцидент создан
        '403':
          description: Недостаточно прав
        '422':
          description: Ошибка валидации

  /incidents/export:
    get:
      tags: [incidents]
      summary: Экспорт инцидентов в CSV
      description: Доступно всем аутентифицированным пользователям.
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [csv]
        - in: query
          name: status
          schema:
            type: string
            enum: [new, inprogress, resolved, falsealarm]
        - in: query
          name: severity
          schema:
            type: string
            enum: [low, medium, high, critical]
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: CSV-файл со списком инцидентов
          content:
            text/csv:
              schema:
                type: string
        '401':
          description: Требуется авторизация
        '422':
          description: Некорректные параметры запроса

  /incidents/{id}:
    get:
      tags: [incidents]
      summary: Получить инцидент по id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Инцидент найден
        '404':
          description: Инцидент не найден

    put:
      tags: [incidents]
      summary: Обновить инцидент
      description: dispatcher может менять только статус, admin — все поля.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                address:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Инцидент обновлён
        '403':
          description: Недостаточно прав
        '404':
          description: Инцидент не найден
        '422':
          description: Ошибка валидации

    delete:
      tags: [incidents]
      summary: Удалить инцидент
      description: Доступно только роли admin.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Инцидент удалён
        '403':
          description: Недостаточно прав
        '404':
          description: Инцидент не найден

  /buildings:
    get:
      tags: [buildings]
      summary: Получить список зданий
      description: Без параметров возвращает массив (обратная совместимость). С page/limit/search возвращает {data, meta}.
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: Список зданий
        '401':
          description: Требуется авторизация

    post:
      tags: [buildings]
      summary: Создать здание
      description: Доступно ролям admin, dispatcher.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address, house, floors, risklevel, status]
              properties:
                name:
                  type: string
                address:
                  type: string
                house:
                  type: string
                floors:
                  type: integer
                risklevel:
                  type: string
                  enum: [low, medium, high, critical]
                status:
                  type: string
                  enum: [new, inprogress, resolved, falsealarm]
                description:
                  type: string
      responses:
        '201':
          description: Здание создано
        '403':
          description: Недостаточно прав
        '422':
          description: Ошибка валидации

  /buildings/export:
    get:
      tags: [buildings]
      summary: Экспорт зданий в CSV
      description: Доступно всем аутентифицированным пользователям.
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [csv]
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: CSV-файл со списком зданий
        '401':
          description: Требуется авторизация

  /buildings/{id}:
    get:
      tags: [buildings]
      summary: Получить здание по id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Здание найдено
        '404':
          description: Здание не найдено

    put:
      tags: [buildings]
      summary: Обновить здание
      description: dispatcher может менять name, floors, status, description; admin — все поля.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Здание обновлено
        '403':
          description: Недостаточно прав
        '404':
          description: Здание не найдено
        '422':
          description: Ошибка валидации

    delete:
      tags: [buildings]
      summary: Удалить здание
      description: Доступно только роли admin.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Здание удалено
        '403':
          description: Недостаточно прав
        '404':
          description: Здание не найдено

  /sensors:
    get:
      tags: [sensors]
      summary: Получить список датчиков
      parameters:
        - in: query
          name: building_id
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive, maintenance]
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: Список датчиков
        '401':
          description: Требуется авторизация

    post:
      tags: [sensors]
      summary: Создать датчик
      description: Доступно только роли admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [building_id, type]
              properties:
                building_id:
                  type: integer
                type:
                  type: string
                location:
                  type: string
                status:
                  type: string
                  enum: [active, inactive, maintenance]
      responses:
        '201':
          description: Датчик создан
        '403':
          description: Недостаточно прав
        '422':
          description: Ошибка валидации

  /sensors/{id}:
    get:
      tags: [sensors]
      summary: Получить датчик по id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Датчик найден
        '404':
          description: Датчик не найден

    put:
      tags: [sensors]
      summary: Обновить датчик
      description: Доступно только роли admin.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Датчик обновлён
        '403':
          description: Недостаточно прав
        '404':
          description: Датчик не найден
        '422':
          description: Ошибка валидации

    delete:
      tags: [sensors]
      summary: Удалить датчик
      description: Доступно только роли admin.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Датчик удалён
        '403':
          description: Недостаточно прав
        '404':
          description: Датчик не найден